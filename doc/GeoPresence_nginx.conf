# GeoPresence – Vorlage für einen vorhandenen HTTPS-server-Block.
# Dokumentationsadresse 192.0.2.20 durch die tatsächliche FHEM-Adresse ersetzen.
# Bei nginx auf dem FHEM-Host stattdessen 127.0.0.1 verwenden.
# Separater GeoPresence-Listener auf Port 8090, kein FHEMWEB-Backend.
# Bei entferntem Proxy webhookBindAddress und webhookAllowedPeers passend setzen.
# Basic-Zugangsdaten prüft GeoPresence selbst, je registrierter Person.
# Die Datei ist ein Location-Snippet, keine eigenständige nginx.conf.
# proxy_pass ohne URI-Anteil erhält den vollständigen Pfad.

location = /fhem/geopresence {
    auth_basic off;
    client_max_body_size 16k;
    proxy_request_buffering on;
    proxy_http_version 1.0;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Connection close;
    proxy_set_header Expect "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    proxy_next_upstream off;
    proxy_intercept_errors off;
    proxy_cache off;
    proxy_pass http://192.0.2.20:8090;
}

# Unterpfade dürfen nicht an den allgemeinen FHEMWEB-Proxy fallen.
location ^~ /fhem/geopresence/ {
    return 404;
}
